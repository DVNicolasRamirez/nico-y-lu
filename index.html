<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nico & Lu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#12307a;--ember:#2f64d0;--amber:#ffd27a;--cream:#f2f6ff;--ink:#0b1635}
*{box-sizing:border-box;margin:0}
body{font:16px/1.6 Inter,system-ui,sans-serif;color:var(--cream);background:linear-gradient(180deg,#050b24,#0b1a4a 45%,#16327a);background-attachment:fixed}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600}
section{max-width:760px;margin:0 auto;padding:64px 20px;text-align:center}
h2{font-size:2.4rem;line-height:1.1;margin-bottom:24px}
h1{font-size:clamp(3.2rem,15vw,6rem);line-height:1}
.sub{opacity:.85;margin:8px 0 28px}
#cd{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#cd div{background:#ffffff1f;border:1px solid #ffffff40;border-radius:14px;padding:10px 12px;min-width:64px}
#cd b{display:block;font:600 1.8rem 'Cormorant Garamond',serif}#cd small{font-size:.7rem;opacity:.8}
.btn{background:var(--cream);color:var(--red);border:0;border-radius:99px;padding:12px 26px;font:600 1rem Inter,sans-serif;cursor:pointer}
.btn:focus-visible,.fo:focus-visible,.pol:focus-visible,.tk button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:2000}
.modal.on{display:flex}
.paper{background:var(--cream);color:var(--ink);border-radius:6px;max-width:520px;max-height:86vh;overflow:auto;padding:32px 28px;text-align:left;box-shadow:0 20px 60px #0008}
.paper p{font:italic 1.35rem/1.5 'Cormorant Garamond',serif;margin-bottom:14px}
.paper .btn{background:var(--red);color:var(--cream);display:block;margin:12px auto 0}
.desk{background:var(--cream);border-radius:6px;padding:28px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px 10px;box-shadow:0 18px 50px #0006}
.pol{background:#fff;border:0;padding:8px 8px 0;box-shadow:0 4px 14px #0004;cursor:pointer;transition:transform .2s;color:var(--ink);font:italic 1rem 'Cormorant Garamond',serif}
.pol:nth-child(odd){transform:rotate(-2.5deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol:hover,.pol:focus-visible{transform:rotate(0) scale(1.05);z-index:2}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.pol span{display:block;padding:8px 2px}
#lb img{max-width:100%;max-height:78vh;border-radius:6px}#lb p{margin-top:10px;font:italic 1.3rem 'Cormorant Garamond',serif}
.love{display:grid;gap:12px;text-align:left}
.love div{background:#ffffff1f;border:1px solid #ffffff3a;border-radius:14px;padding:14px 18px;font:italic 1.35rem 'Cormorant Garamond',serif}
#map{height:380px;border-radius:14px;border:2px solid #ffffff55;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button{background:#ffffff26;color:var(--cream);border:1px solid #fff6;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}
.pin{font-size:26px;filter:drop-shadow(0 2px 3px #0006);text-align:center}
.leaflet-popup-content{font:14px Inter,sans-serif;color:var(--ink)}.leaflet-popup-content a{color:var(--red);font-weight:600}
.yt{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px #0006}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:#ffffff26;color:var(--cream);border:1px solid #fff6;border-radius:99px;padding:6px 16px;cursor:pointer;font:inherit}.tabs .on{background:var(--cream);color:var(--red)}
.tix{display:grid;gap:14px}
.tk{display:flex;align-items:stretch;background:var(--cream);color:var(--ink);border-radius:12px;text-align:left;overflow:hidden;box-shadow:0 6px 20px #0004}
.tk .t{flex:1;padding:14px 16px;font:italic 1.25rem/1.25 'Cormorant Garamond',serif}.tk .t small{display:block;font:600 .7rem Inter,sans-serif;color:var(--ember);margin-bottom:2px}
.tk button{border:0;border-left:2px dashed #8fa8d8;background:#dbe6fb;color:var(--red);font:600 .85rem Inter,sans-serif;padding:0 16px;cursor:pointer;min-width:96px}
.tk.used{opacity:.55}.tk.used .t{text-decoration:line-through}.tk.used button{background:#e5ddd5;color:#6b5a50}
.wh{position:relative;width:min(320px,86vw);margin:0 auto 18px}.wh canvas{width:100%;display:block;border-radius:50%;box-shadow:0 10px 30px #0006}
.wh::before{content:'';position:absolute;top:-6px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:22px solid var(--amber);z-index:2}
.res{background:var(--cream);color:var(--ink);border-radius:12px;padding:14px 16px;font:italic 1.3rem/1.3 'Cormorant Garamond',serif;margin:16px auto 28px;max-width:460px}.res .btn{background:var(--red);color:var(--cream);margin-top:10px}
.mp{max-width:360px;margin:0 auto;background:#0d0f1a;border:1px solid #ffffff22;border-radius:18px;padding:18px;color:#fff;box-shadow:0 14px 40px #0008;text-align:left}
.mp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.mi{margin:14px 0 6px}.mi b{display:block;font:600 1.1rem/1.25 Inter,sans-serif}.mi small{opacity:.65}
.bar{display:flex;align-items:center;gap:8px;font-size:.75rem;opacity:.85}.bar input{flex:1;accent-color:#fff}
.ppb{display:block;margin:10px auto;width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:#0d0f1a;font-size:1.5rem;cursor:pointer}
.lnk{background:none;border:0;color:#ffffffb0;font:inherit;font-size:.85rem;cursor:pointer;display:block;margin:0 auto;text-decoration:underline}
.yt.off{position:absolute;left:-9999px;width:320px;height:180px}.mp~.yt{max-width:360px;margin:14px auto 0}
.fl{position:fixed;top:-30px;pointer-events:none;z-index:0;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:0}}
@media(min-width:640px){.desk{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){.fl{display:none}.pol{transition:none}}
</style></head><body>

const $=s=>document.querySelector(s),mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h)e.innerHTML=h;return e};
$('#nm').textContent=C.de+' & '+C.para;$('#from').textContent=C.de;document.title=C.de+' & '+C.para;
$('#msg').innerHTML=C.carta.map(p=>'<p>'+p+'</p>').join('');
const m1=$('#m1'),lb=$('#lb');
$('#open').onclick=()=>m1.classList.add('on');
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-close'))m.classList.remove('on')});
addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))});
/* contador */
const cd=$('#cd'),U=['años','meses','días','horas','min','seg'];
function tick(){const a=new Date(C.desde),b=new Date();let y=b.getFullYear()-a.getFullYear(),mo=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate(),h=b.getHours()-a.getHours(),mi=b.getMinutes()-a.getMinutes(),s=b.getSeconds()-a.getSeconds();
if(s<0){s+=60;mi--}if(mi<0){mi+=60;h--}if(h<0){h+=24;d--}if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();mo--}if(mo<0){mo+=12;y--}
cd.innerHTML=[y,mo,d,h,mi,s].map((v,i)=>'<div><b>'+v+'</b><small>'+U[i]+'</small></div>').join('')}
tick();setInterval(tick,1000);
/* fotos */
C.fotos.forEach((f,i)=>{const b=mk('button','pol','<img src="'+PH[i]+'" alt="'+f[1]+'"><span>'+f[0]+'</span>');b.onclick=()=>{lb.querySelector('img').src=PH[i];lb.querySelector('img').alt=f[1];lb.querySelector('p').textContent=f[0]+' · '+f[1];lb.classList.add('on')};$('#desk').append(b)});
C.amo.forEach(t=>$('#love').append(mk('div','',t)));
/* mapa */
const map=L.map('map',{scrollWheelZoom:true}),mks=[];
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
C.lugares.forEach(([n,la,lo,t])=>{const k=L.marker([la,lo],{icon:L.divIcon({html:'❤️',className:'pin',iconSize:[28,28]})}).addTo(map).bindPopup('<b>'+n+'</b><br>'+t+'<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+la+','+lo+'">Abrir en Google Maps</a>');mks.push(k);
const c=mk('button','',n);c.onclick=()=>{map.flyTo([la,lo],11);k.openPopup()};$('#chips').append(c)});
map.fitBounds(L.latLngBounds(C.lugares.map(p=>[p[1],p[2]])).pad(.2));
/* canción */
const id=(C.cancion.match(/(?:youtu\.be\/|v=)([\w-]{11})/)||[])[1];
$('#yl').href='https://www.youtube.com/watch?v='+id;$('#cov').src='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
let yp,tm;const fm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function up(){if(!yp||!yp.getDuration)return;const d=yp.getDuration()||1,c=yp.getCurrentTime();$('#sk').value=c/d*100;$('#t1').textContent=fm(c);$('#t2').textContent=fm(d)}
window.onYouTubeIframeAPIReady=()=>{yp=new YT.Player('yt',{videoId:id,width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{const d=yp.getVideoData();if(d.title)$('#tt').textContent=d.title;if(d.author)$('#ar').textContent=d.author;up()},onStateChange:e=>{const on=e.data===1;$('#pp').textContent=on?'❚❚':'▶';clearInterval(tm);if(on)tm=setInterval(up,500);if(e.data===0)up()}}})};
const ys=document.createElement('script');ys.src='https://www.youtube.com/iframe_api';document.head.append(ys);
$('#pp').onclick=()=>{if(!yp||!yp.getPlayerState)return;yp.getPlayerState()===1?yp.pauseVideo():yp.playVideo()};
$('#sk').oninput=e=>{if(yp&&yp.seekTo)yp.seekTo(yp.getDuration()*e.target.value/100,true)};
$('#tv').onclick=()=>{const w=$('#ytw').classList.toggle('off');$('#tv').textContent=w?'Ver video':'Ocultar video'};
/* vales */
let st={};try{st=JSON.parse(localStorage.getItem('vales')||'{}')}catch(e){}
let cat='Todos',arm=-1;const cats=['Todos',...new Set(C.vales.map(v=>v[0]))];
function draw(){$('#tabs').innerHTML='';cats.forEach(c=>{const b=mk('button',c===cat?'on':'',c==='Todos'?c:c+'s');b.onclick=()=>{cat=c;draw()};$('#tabs').append(b)});
$('#tix').innerHTML='';C.vales.forEach((v,i)=>{if(cat!=='Todos'&&v[0]!==cat)return;const u=st[i],t=mk('div','tk'+(u?' used':''),'<div class="t"><small>'+v[0]+'</small>'+v[1]+'</div>'),b=mk('button','',u?'Canjeado':(arm===i?'¿Seguro?':'Canjear'));
b.onclick=()=>{if(!u&&arm!==i){arm=i;draw();setTimeout(()=>{if(arm===i){arm=-1;draw()}},3000);return}arm=-1;st[i]=!u;try{localStorage.setItem('vales',JSON.stringify(st))}catch(e){}draw();wdraw()};t.append(b);$('#tix').append(t)})}
draw();
/* ruleta */
const cv=$('#wh'),cx=cv.getContext('2d'),N=C.vales.length,A=2*Math.PI/N,cs=getComputedStyle(document.documentElement);let rot=0,busy=false;
function wdraw(){const s=cv.width,r=s/2,c1=cs.getPropertyValue('--red').trim(),c2=cs.getPropertyValue('--ember').trim(),cr=cs.getPropertyValue('--cream').trim();cx.clearRect(0,0,s,s);
C.vales.forEach((v,i)=>{const a0=rot+i*A;cx.beginPath();cx.moveTo(r,r);cx.arc(r,r,r-4,a0,a0+A);cx.fillStyle=st[i]?'#6b6b7a':(i%2?c2:c1);cx.fill();cx.strokeStyle=cr;cx.lineWidth=2;cx.stroke();
cx.save();cx.translate(r,r);cx.rotate(a0+A/2);cx.fillStyle=cr;cx.font='600 22px Inter,sans-serif';cx.textAlign='right';cx.textBaseline='middle';let x=v[1].replace(/^Vale por (un |una |uno )?/,'');x=x.length>16?x.slice(0,15)+'…':x;cx.fillText(x,r-24,0);cx.restore()})}
$('#spin').onclick=()=>{if(busy)return;const av=C.vales.map((v,i)=>i).filter(i=>!st[i]);if(!av.length){$('#res').innerHTML='<div class="res">¡Ya canjeaste todos los vales! 💙</div>';return}
const i=av[Math.floor(Math.random()*av.length)],P=2*Math.PI,need=((-Math.PI/2-(i+.5)*A)%P+P)%P,cur=((rot%P)+P)%P,tot=((need-cur+P)%P)+P*5,r0=rot,d=matchMedia('(prefers-reduced-motion:reduce)').matches?300:4000,t0=performance.now();busy=true;$('#res').innerHTML='';
(function f(n){const p=Math.min(1,(n-t0)/d);rot=r0+tot*(1-Math.pow(1-p,3));wdraw();if(p<1)requestAnimationFrame(f);else{busy=false;const b=mk('button','btn','Canjear este vale');b.onclick=()=>{st[i]=true;try{localStorage.setItem('vales',JSON.stringify(st))}catch(e){}$('#res').innerHTML='';draw();wdraw()};const q=mk('div','res','<small style="font:600 .7rem Inter,sans-serif;color:var(--ember)">'+C.vales[i][0].toUpperCase()+'</small><br>'+C.vales[i][1]+'<br>');q.append(b);$('#res').append(q)}})(t0)};
wdraw();
/* corazones */
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{const h=mk('div','fl','♥');h.style.cssText='left:'+Math.random()*100+'vw;font-size:'+(12+Math.random()*18)+'px;color:#cfe0ff;opacity:.6;animation-duration:'+(7+Math.random()*6)+'s';document.body.append(h);setTimeout(()=>h.remove(),13000)},1400);
</script></body></html>
